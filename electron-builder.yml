appId: org.trlx.route-studio
productName: Route Studio
asar: true
npmRebuild: false
directories:
  output: release
  buildResources: build
files:
  - dist/**/*
  - dist-electron/**/*
  - src/i18n/*.desktop.json
  - build/icons/icon.png
  - LICENSE
  - package.json
publish:
  provider: github
  owner: TRL-X
  repo: route-studio
  releaseType: draft
artifactName: Route-Studio-${version}-${os}-${arch}.${ext}
mac:
  # Unsigned macOS builds use GitHub release metadata and manual DMG downloads.
  publish: null
  category: public.app-category.utilities
  icon: build/icons/icon.icns
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  target:
    - dmg
    - zip
  fileAssociations:
    - ext: gpx
      name: GPX route
      role: Editor
      rank: Alternate
    - ext: kml
      name: KML route
      role: Editor
      rank: Alternate
    - ext: fit
      name: FIT route
      role: Editor
      rank: Alternate
    - ext: rte
      name: TRL-X route
      role: Editor
      rank: Alternate
  extendInfo:
    NSBluetoothAlwaysUsageDescription: Route Studio uses Bluetooth to upload route files to your device.
    NSBluetoothPeripheralUsageDescription: Route Studio uses Bluetooth to upload route files to your device.
win:
  icon: build/icons/icon.ico
  target:
    - nsis
nsis:
  include: build/installer.nsh
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
linux:
  icon: build/icons/icon.png
  category: Utility
  maintainer: TRL-X
  fileAssociations:
    - ext: gpx
      mimeType: application/gpx+xml
    - ext: kml
      mimeType: application/vnd.google-earth.kml+xml
    - ext: fit
      mimeType: application/vnd.ant.fit
    - ext: rte
      mimeType: application/x-trlx-route
  target:
    - AppImage
    - deb
