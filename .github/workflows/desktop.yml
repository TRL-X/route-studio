name: Desktop packages

on:
  workflow_call:

permissions:
  contents: read

jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            platform: mac
            arch: arm64
          - os: macos-15-intel
            platform: mac
            arch: x64
          - os: windows-latest
            platform: win
            arch: x64
          - os: ubuntu-latest
            platform: linux
            arch: x64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Install Electron runtime
        run: npx install-electron --no
      - name: Install Linux runtime dependencies
        if: runner.os == 'Linux'
        run: npx playwright install-deps chromium
      - name: Validate release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: node --input-type=module -e 'import fs from "node:fs"; const version = JSON.parse(fs.readFileSync("package.json")).version; if (process.env.GITHUB_REF_NAME !== `v${version}`) throw new Error("Tag must match package.json version");'
      - run: npm run desktop:build
      - name: Build platform installers
        shell: bash
        env:
          CSC_LINK: ${{ startsWith(github.ref, 'refs/tags/') && (matrix.platform == 'mac' && secrets.MAC_CSC_LINK || matrix.platform == 'win' && secrets.WIN_CSC_LINK) || '' }}
          CSC_KEY_PASSWORD: ${{ startsWith(github.ref, 'refs/tags/') && (matrix.platform == 'mac' && secrets.MAC_CSC_KEY_PASSWORD || matrix.platform == 'win' && secrets.WIN_CSC_KEY_PASSWORD) || '' }}
          APPLE_API_KEY_BASE64: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_API_KEY || '' }}
          APPLE_API_KEY_ID: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ startsWith(github.ref, 'refs/tags/') && secrets.APPLE_API_ISSUER || '' }}
        run: |
          if [[ -z "${CSC_LINK:-}" ]]; then
            # electron-builder treats an empty CSC_LINK as a certificate path to the current directory.
            unset CSC_LINK CSC_KEY_PASSWORD
            export CSC_IDENTITY_AUTO_DISCOVERY=false
          fi
          args=(--${{ matrix.platform }} --${{ matrix.arch }} --publish never)
          if [[ -n "${CSC_LINK:-}" ]]; then args+=(-c.forceCodeSigning=true); fi
          if [[ "${{ matrix.platform }}" == "mac" && -z "${CSC_LINK:-}" ]]; then
            # Ad-hoc signing needs no secrets, including on pull requests.
            export CSC_FOR_PULL_REQUEST=true
            args+=(-c.mac.identity=- -c.mac.notarize=false)
            args+=(-c.mac.entitlements=build/entitlements.mac.adhoc.plist)
            args+=(-c.mac.entitlementsInherit=build/entitlements.mac.adhoc.plist)
          fi
          if [[ "${{ matrix.platform }}" == "mac" && -n "${CSC_LINK:-}" ]]; then
            test -n "$APPLE_API_KEY_BASE64" && test -n "$APPLE_API_KEY_ID" && test -n "$APPLE_API_ISSUER"
            export APPLE_API_KEY="$RUNNER_TEMP/route-studio-notarization.p8"
            node --input-type=module -e 'import fs from "node:fs"; fs.writeFileSync(process.env.APPLE_API_KEY, Buffer.from(process.env.APPLE_API_KEY_BASE64, "base64"), { mode: 0o600 });'
            trap 'rm -f "$APPLE_API_KEY"' EXIT
          fi
          npx electron-builder "${args[@]}"
      - name: Verify installers and update manifests
        run: node scripts/verify-release.mjs release ${{ matrix.platform }} ${{ matrix.arch }}
      - name: Test macOS signature validation
        if: runner.os == 'macOS'
        run: node --test tests/ci/mac-signatures.test.mjs
      - name: Verify macOS application and archive signatures
        if: runner.os == 'macOS'
        run: node scripts/verify-macos-signatures.mjs release ${{ matrix.arch }}
      - name: Locate packaged executable
        shell: bash
        run: node scripts/packaged-executable.mjs >> "$GITHUB_ENV"
      - name: Test packaged application
        if: runner.os != 'Linux'
        run: npm run test:desktop
      - name: Test packaged application on Linux
        if: runner.os == 'Linux'
        run: xvfb-run --auto-servernum npm run test:desktop
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform }}-${{ matrix.arch }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: desktop-test-results-${{ matrix.platform }}-${{ matrix.arch }}
          path: desktop-test-results
